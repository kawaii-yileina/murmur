# 本地开发 profile：IDEA 直接运行时使用 -Dspring.profiles.active=dev
# 中间件均为本机 docker 端口（MySQL 3308 / Redis 6380）；密钥走环境变量，见 docker/.env
# （IDEA 运行配置需设置：DB_PASSWORD、REDIS_PASSWORD、JWT_SECRET，值与 docker/.env 一致）
spring:
  datasource:
    url: jdbc:mysql://localhost:3308/im_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6380
  mail:
    # 465 = SMTPS（QQ 邮箱推荐）；未配置 MAIL_* 时验证码接口返回“邮件服务未配置”，不影响启动
    port: ${MAIL_PORT:465}

im:
  cluster:
    # 本地单机：关闭分布式路由（无需 RocketMQ/Redis 路由心跳）
    enabled: false
  asr:
    enabled: ${IM_ASR_ENABLED:false}

storage:
  type: local
  local:
    base-path: ./uploads

logging:
  level:
    com.im: DEBUG
    # MyBatis SQL 日志（==> Preparing 等）；生产 profile 为 INFO，不打印
    org.apache.ibatis: DEBUG
