# 单机生产：docker-compose.standalone.yml 激活（SPRING_PROFILES_ACTIVE=standalone，自动包含 container）。
# 不启用分布式连接路由与 RocketMQ，中间件/密钥仍由 compose 环境变量注入。
im:
  cluster:
    enabled: false
  file:
    # 单机常见 HTTP 部署：默认不要求 Secure；HTTPS 环境用 IM_FILE_COOKIE_SECURE=true 覆盖
    cookie-secure: false
    cookie-same-site: Lax

logging:
  level:
    com.im: ${LOG_LEVEL_COM_IM:INFO}
