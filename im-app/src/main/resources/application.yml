server:
  port: 8180
  address: 0.0.0.0

spring:
  application:
    name: im-server
  cloud:
    nacos:
      discovery:
        # 默认关闭：非集群模式启动不依赖 Nacos；集群模式用 application-cluster.yml 打开
        enabled: ${NACOS_ENABLED:false}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://localhost:3308/im_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6380
  mail:
    # 邮件服务：通过环境变量注入，未配置时验证码接口返回“邮件服务未配置”
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

chat:
  port: 9100
  auto-authenticate: true
  idle-timeout-seconds: 300
  context: /
  test-mode: false

storage:
  type: local
  local:
    base-path: ./uploads
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: im-files

hermes:
  enabled: true
  native-api: true
  api-type: openai
  base-url: http://localhost:8642/v1
  api-key: fe2c6a612110c2cac9a3f7ab016481b9c3d8cda8e324adea77c5dd126a3ce613
  model: hermes-agent
  max-tokens: 4096
  temperature: 0.7
  session-timeout: 3600

im:
  rate-limit:
    # 用户级发送限流：1 秒窗口内允许的最大消息条数（<=0 关闭）
    messages-per-second: 5
  mail:
    # 邮件验证码开关；需同时配置 spring.mail.* 才能发送
    enabled: ${MAIL_ENABLED:false}
  cluster:
    # 分布式连接路由总开关；关闭时全部跨节点逻辑不生效（单机行为不变）
    enabled: ${CLUSTER_ENABLED:false}
    # 节点标识：多实例必须唯一
    node-id: ${NODE_ID:connector-local-1}
    # 连接路由表 TTL（秒）
    route-ttl-seconds: 90
    # 路由 TTL 续期节流间隔（秒）
    heartbeat-renew-seconds: 30
    # 默认设备类型（当前客户端为手机端）
    default-device-type: mobile
    # 节点存活标记 TTL（秒）
    node-ttl-seconds: 30
    # 节点心跳间隔（毫秒）
    node-heartbeat-millis: 10000

jwt:
  # 必须通过环境变量 JWT_SECRET 注入（>=32 字节），不得写入配置文件,开发环境可以写入配置文件
  secret: ${JWT_SECRET:im-secret-key-for-jwt-token-generation-2024}
  expiration: 7200000            # access token 有效期：2 小时（毫秒）
  refresh-expiration: 2592000000 # refresh token 有效期：30 天
  refresh-grace: 60000           # 轮换后旧 refresh token 的宽限期：60s（容忍并发刷新/响应丢失）
  token-name: token

logging:
  level:
    com.im: DEBUG
    com.elaina: DEBUG
