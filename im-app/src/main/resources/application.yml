server:
  port: 8180
  address: 0.0.0.0

spring:
  application:
    name: im-server
  profiles:
    # 本地直接用 IDEA 启动时默认 dev；docker 通过 SPRING_PROFILES_ACTIVE 指定 prod/standalone
    default: dev
    group:
      # prod 与 standalone 共用容器环境配置（application-container.yml）
      prod: container
      standalone: container
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          # 465 为 SMTPS；如改用 587 请同时开启 starttls.enable 并关闭 ssl.enable
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        # 仅暴露 health（含容器探针）；metrics/info 等不通过 HTTP 暴露
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      node: ${im.cluster.node-id:connector-local-1}
  health:
    mail:
      # 邮件为可选功能，不参与整体健康判定
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

chat:
  port: 9100
  auto-authenticate: true
  idle-timeout-seconds: 300
  context: /ws/api/
  test-mode: false

storage:
  # 默认本地磁盘；dev/容器 profile 按需覆盖
  type: local
  local:
    base-path: ./uploads

hermes:
  enabled: true
  native-api: true
  api-type: openai
  base-url: http://localhost:8642/v1
  model: hermes-agent
  max-tokens: 4096
  temperature: 0.7
  session-timeout: 3600

im:
  cache:
    # 全局缓存（Spring Cache + Redis）开关与默认 TTL（秒）
    enabled: true
    ttl-seconds: 300
  cors:
    # 跨域来源白名单；* 仅用于同域开发（不发送跨域 Cookie）
    # Capacitor 的 Android http scheme 来源为 http://localhost，需显式加入白名单
    allowed-origins: "${IM_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://localhost:5174}"
  asr:
    # 语音转文字（本地 ASR HTTP 服务），默认关闭
    enabled: false
    path: /inference
    language: zh
    timeout-seconds: 60
    max-audio-bytes: 15728640
  call:
    ring-timeout-seconds: 30
    enabled: true
    stun-urls: stun:stun.l.google.com:19302
  rate-limit:
    # 用户级发送限流：1 秒窗口内允许的最大消息条数（<=0 关闭）
    messages-per-second: 5
  group:
    # 每个群的管理员上限（群主不计入）
    max-admins: 3
  file:
    # 文件 Cookie 鉴权：开发 HTTP 用 Lax；生产 HTTPS 跨站需 secure=true + None
    cookie-secure: false
    cookie-same-site: Lax
  cluster:
    # 分布式连接路由；仅 prod 开启
    enabled: false
  crypto:
    # 应用层消息体加密；默认关闭，启用即对所有连接强制（fail-closed）
    enabled: false
    key-id: k1

jwt:
  expiration: 7200000
  refresh-expiration: 2592000000
  refresh-grace: 60000
  token-name: token

logging:
  level:
    root: INFO
    com.im: INFO
    com.elaina: INFO
    # 应用层加密：压制框架对消息体的 debug/info 打印，避免解密后明文进日志（F-16）
    com.elaina.chat.transport.server.ChatServerHandler: INFO
    com.elaina.chat.transport.codec.ChatMessageDecoder: WARN
    # 压制握手期打印 WS URI/PRE_ATTRS（含 ?token=）（F-15）
    com.elaina.chat.transport.server.HttpParamExtractorHandler: WARN
