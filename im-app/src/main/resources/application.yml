server:
  port: 8180
  address: 0.0.0.0

spring:
  application:
    name: im-server
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://localhost:3308/im_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6380
  mail:
    # 邮件服务：通过环境变量注入，未配置时验证码接口返回“邮件服务未配置”
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        # 仅暴露只读端点；/actuator/** 仍受鉴权保护（需 JWT）
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        # 暴露 /actuator/health/liveness 与 /actuator/health/readiness（容器探针；排空时 readiness 转 REFUSING_TRAFFIC）
        enabled: true
  metrics:
    tags:
      # 统一为全部指标（含 JVM/HTTP）附加节点标签，便于多节点区分
      node: ${im.cluster.node-id:connector-local-1}
  health:
    mail:
      # 邮件为可选功能（未配置 spring.mail.* 时不可用），不参与整体健康判定
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

chat:
  port: 9100
  auto-authenticate: true
  idle-timeout-seconds: 300
  context: /
  test-mode: false

storage:
  type: local
  local:
    base-path: ./uploads
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: im-files

hermes:
  enabled: true
  native-api: true
  api-type: openai
  base-url: http://localhost:8642/v1
  api-key: ${HERMES_API_KEY:}
  model: hermes-agent
  max-tokens: 4096
  temperature: 0.7
  session-timeout: 3600

im:
  admin:
    # 管理员用户名单（逗号分隔）：可访问 /actuator/metrics 与 /api/admin/outbox；留空则无管理员
    user-ids: ${IM_ADMIN_USER_IDS:}
  call:
    # 音视频通话：振铃超时（秒），超时未接通知双方（通话记录落库见 G2）
    ring-timeout-seconds: 30
    enabled: ${IM_CALL_ENABLED:true}
  rate-limit:
    # 用户级发送限流：1 秒窗口内允许的最大消息条数（<=0 关闭）
    messages-per-second: 5
  mail:
    # 邮件验证码开关；需同时配置 spring.mail.* 才能发送
    enabled: ${MAIL_ENABLED:false}
  cluster:
    # 分布式连接路由总开关；关闭时全部跨节点逻辑不生效（单机行为不变）
    enabled: ${CLUSTER_ENABLED:false}
    # 节点标识：多实例必须唯一
    node-id: ${NODE_ID:connector-local-1}
    # 连接路由表 TTL（秒）
    route-ttl-seconds: 90
    # 路由 TTL 续期节流间隔（秒）
    heartbeat-renew-seconds: 30
    # 默认设备类型（当前客户端为手机端）
    default-device-type: mobile
    # 节点存活标记 TTL（秒）
    node-ttl-seconds: 30
    # 节点心跳间隔（毫秒）
    node-heartbeat-millis: 10000
    # 优雅停机宽限期（毫秒）：先摘除节点存活标记，等待在途投递结束后再清理路由
    # 需覆盖其他节点对存活标记/路由的短缓存（RouteRegistry 2s），故默认 5000ms；上限在代码中钳制为 10000ms
    node-shutdown-grace-millis: 5000
    # 指标采样间隔（毫秒）
    metrics-interval-millis: 15000
    # Outbox 死信处置接口（运维用，默认关闭；开启后仅 im.admin.user-ids 名单用户可访问）
    outbox-admin:
      enabled: ${OUTBOX_ADMIN_ENABLED:false}
    # Outbox 每批领取数量
    outbox-batch: 200
    # 同一会话 Outbox 在途（未 DONE）条数上限（窗口内近似有序，保证吞吐）
    outbox-conversation-window: 100
    # Outbox 任务租约（秒）
    outbox-lease-seconds: 30
    # Outbox 轮询间隔（毫秒）
    outbox-poll-millis: 500
    # Outbox 最大重试次数（超过置 DEAD）
    outbox-max-retry: 8
    # Outbox 退避基数（毫秒）
    outbox-backoff-base-millis: 1000
    # Outbox 退避上限（毫秒）
    outbox-backoff-max-millis: 60000
    # 待处理积压告警阈值
    outbox-backlog-alert-threshold: 1000
    # 跨节点消费最大重消费次数（超过作死信：落离线兜底 + 告警）
    consumer-max-reconsume: 5

jwt:
  # 必须通过环境变量 JWT_SECRET 注入（>=32 字节），不得写入配置文件,开发环境可以写入配置文件
  secret: ${JWT_SECRET:im-secret-key-for-jwt-token-generation-2024}
  expiration: 7200000            # access token 有效期：2 小时（毫秒）
  refresh-expiration: 2592000000 # refresh token 有效期：30 天
  refresh-grace: 60000           # 轮换后旧 refresh token 的宽限期：60s（容忍并发刷新/响应丢失）
  token-name: token

logging:
  level:
    com.im: DEBUG
    com.elaina: DEBUG
