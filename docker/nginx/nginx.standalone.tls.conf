# 单实例 HTTPS/WSS 网关配置（域名与证书就绪后启用）。
# 启用步骤：
#   1. 将证书放到 im-server/docker/certs/ 下：fullchain.pem、privkey.pem（域名 www.elaina.uno）。
#   2. 在 docker-compose.standalone.yml 的 gateway 中把 nginx.standalone.conf 换成本文件：
#        - ./nginx/nginx.standalone.tls.conf:/etc/nginx/nginx.conf:ro
#   3. docker compose -f docker-compose.standalone.yml up -d gateway
# 客户端据此把 App 地址改为 https://www.elaina.uno 与 wss://www.elaina.uno。
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream im_http {
        server im-server:8180;
    }
    upstream im_ws {
        server im-server:9100;
    }

    # HTTP：ACME 校验放行，其余 301 跳 HTTPS
    server {
        listen 80;
        server_name www.elaina.uno elaina.uno;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.elaina.uno elaina.uno;
        client_max_body_size 100m;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        location /api/ {
            proxy_pass http://im_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /actuator/ {
            proxy_pass http://im_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 其余（含根路径）为 WebSocket 长连接（wss）
        location / {
            proxy_pass http://im_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
