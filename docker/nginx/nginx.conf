worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # WebSocket 升级所需的 Connection 头映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 两个 IM 实例：REST 与 WebSocket 分别负载均衡（无需粘性会话——路由由 Redis 维护，任意节点均可处理）
    upstream im_http {
        server im-server-1:8180;
        server im-server-2:8180;
    }
    upstream im_ws {
        server im-server-1:9100;
        server im-server-2:9100;
    }

    server {
        listen 80;
        client_max_body_size 110m;

        # REST / Actuator：以 /api 前缀转发
        location /api/ {
            proxy_pass http://im_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 健康/指标（探针、运维）；具体鉴权由应用层控制
        location /actuator/ {
            proxy_pass http://im_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 其余（含根路径）为 WebSocket 长连接
        location / {
            proxy_pass http://im_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
