# IM 集群基础设施（本地 / 开发）
# 启动： docker compose -f im-server/docker/docker-compose.yml up -d
# 停止： docker compose -f im-server/docker/docker-compose.yml down
# 端口与 application.yml / application-cluster.yml 默认值对齐：
#   MySQL 3308 | Redis 6380 | RocketMQ 9876 / 10911
# 节点服务发现以 Redis 心跳（im:node:{nodeId}）为准，不引入 Nacos。
name: im-infra

services:
  mysql:
    image: mysql:8.0
    container_name: im-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: im_db
      TZ: Asia/Shanghai
    volumes:
      - im-mysql-data:/var/lib/mysql
      - ../../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: im-redis
    ports:
      - "6380:6379"
    # 打开 keyspace 通知（在线状态过期事件依赖）
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
    volumes:
      - im-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rmqnamesrv:
    image: apache/rocketmq:5.3.1
    container_name: im-rmqnamesrv
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx512m"
    ports:
      - "9876:9876"

  rmqbroker:
    image: apache/rocketmq:5.3.1
    container_name: im-rmqbroker
    depends_on:
      - rmqnamesrv
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx1g"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      # 注意：apache/rocketmq 镜像以 rocketmq(3000) 运行，命名卷默认 root 所有会导致其无法写日志/store
      # 从而 broker initialize() 失败退出，故此处不挂载日志/store 卷（容器内目录本身可写）
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro

volumes:
  im-mysql-data:
  im-redis-data:
