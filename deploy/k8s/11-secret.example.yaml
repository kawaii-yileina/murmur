# 敏感配置示例（请勿提交真实值）。部署前用命令创建，或复制本文件改为 secret.yaml（加入 .gitignore）后填写。
#
#   kubectl -n im create secret generic im-server-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<生产数据库密码>'
#
# 注意：JWT_SECRET 至少 32 字节；生产环境不得复用开发默认口令。
apiVersion: v1
kind: Secret
metadata:
  name: im-server-secret
  namespace: im
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_SECRET_AT_LEAST_32_BYTES"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_PROD_DB_PASSWORD"
  HERMES_API_KEY: "REPLACE_WITH_HERMES_API_KEY"
  # 邮件验证码授权码（QQ 邮箱「设置-账户-POP3/SMTP服务」获取）；启用邮件时必填
  MAIL_PASSWORD: "REPLACE_WITH_MAIL_AUTH_CODE"
  # TURN（coturn）静态共享密钥，须与 coturn 的 static-auth-secret 一致
  TURN_SHARED_SECRET: "REPLACE_WITH_TURN_SHARED_SECRET"
